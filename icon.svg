<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Usage Radar">
  <defs>
    <linearGradient id="dsr-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1830"/>
      <stop offset="1" stop-color="#12395c"/>
    </linearGradient>
    <linearGradient id="dsr-arc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.55" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="dsr-sweep" x1="0.1" y1="0.9" x2="0.95" y2="0.15">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="dsr-clip">
      <rect x="0" y="0" width="64" height="64" rx="15"/>
    </clipPath>
  </defs>

  <g clip-path="url(#dsr-clip)">
    <rect width="64" height="64" rx="15" fill="url(#dsr-bg)"/>

    <!-- radar sweep -->
    <path d="M32 34 L32 6 A28 28 0 0 1 56.2 20.4 Z" fill="url(#dsr-sweep)"/>

    <!-- rings -->
    <circle cx="32" cy="34" r="24" fill="none" stroke="#7dd3fc" stroke-opacity="0.2" stroke-width="1"/>
    <circle cx="32" cy="34" r="16" fill="none" stroke="#7dd3fc" stroke-opacity="0.28" stroke-width="1"/>
    <circle cx="32" cy="34" r="8" fill="none" stroke="#7dd3fc" stroke-opacity="0.36" stroke-width="1"/>
    <path d="M32 10v48M8 34h48" stroke="#7dd3fc" stroke-opacity="0.16" stroke-width="1"/>

    <!-- gauge arc: 78% of a 270° dial -->
    <path d="M13.4 49.5 A26 26 0 1 1 50.6 49.5"
          fill="none" stroke="#7dd3fc" stroke-opacity="0.22" stroke-width="5.5"
          stroke-linecap="round"/>
    <path d="M13.4 49.5 A26 26 0 0 1 53.9 20.4"
          fill="none" stroke="url(#dsr-arc)" stroke-width="5.5" stroke-linecap="round"/>

    <!-- token spark -->
    <circle cx="53.9" cy="20.4" r="4.2" fill="#0a1830"/>
    <circle cx="53.9" cy="20.4" r="3" fill="#5eead4"/>

    <!-- hub -->
    <circle cx="32" cy="34" r="3.4" fill="#e0f2fe"/>
    <circle cx="32" cy="34" r="6.6" fill="none" stroke="#e0f2fe" stroke-opacity="0.3" stroke-width="1"/>
  </g>
</svg>
